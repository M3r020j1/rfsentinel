<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">RFSentinel</title>
  <desc id="desc">Logo RFSentinel : bouclier radar bleu nuit, balayage cyan, point de détection ambre et nom en lettres capitales.</desc>
  <defs>
    <linearGradient id="shield" x1="42" y1="26" x2="214" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142C49"/><stop offset="1" stop-color="#091727"/>
    </linearGradient>
    <linearGradient id="sweep" x1="76" y1="173" x2="172" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29D7E8" stop-opacity=".08"/><stop offset="1" stop-color="#29D7E8" stop-opacity=".48"/>
    </linearGradient>
    <clipPath id="inside"><path d="M128 35 196 59v55c0 48-27 82-68 106-41-24-68-58-68-106V59l68-24Z"/></clipPath>
  </defs>
  <g transform="translate(8 0) scale(.86)">
    <path d="M128 18 216 49v66c0 60-34 101-88 132-54-31-88-72-88-132V49l88-31Z" fill="url(#shield)"/>
    <path d="M128 35 196 59v55c0 48-27 82-68 106-41-24-68-58-68-106V59l68-24Z" fill="none" stroke="#44D8E8" stroke-width="3" stroke-linejoin="round"/>
    <g clip-path="url(#inside)">
      <circle cx="128" cy="126" r="67" fill="none" stroke="#4BCEDF" stroke-opacity=".25" stroke-width="2"/>
      <circle cx="128" cy="126" r="43" fill="none" stroke="#4BCEDF" stroke-opacity=".35" stroke-width="2"/>
      <path d="M62 126h132M128 58v136" stroke="#4BCEDF" stroke-opacity=".28" stroke-width="2"/>
      <path d="M128 126 174 79a66 66 0 0 0-66-18Z" fill="url(#sweep)"/>
      <path d="M128 126 174 79" stroke="#4DE0ED" stroke-width="3" stroke-linecap="round"/>
    </g>
    <circle cx="128" cy="126" r="8" fill="#F4B84A"/>
    <circle cx="174" cy="79" r="6" fill="#F4B84A" stroke="#142C49" stroke-width="3"/>
  </g>
  <text x="226" y="119" fill="#10243A" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="1.5">RF<tspan fill="#25BFD1">Sentinel</tspan></text>
  <path d="M230 145h78" stroke="#F4B84A" stroke-width="4" stroke-linecap="round"/>
  <text x="230" y="174" fill="#62788E" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3.1">PASSIVE RADIO MONITORING</text>
